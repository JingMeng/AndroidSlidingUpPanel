apply plugin: 'com.android.library'

repositories {
    google()
    mavenCentral()
    jcenter()
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.1.0'


}

android {
    compileSdkVersion 26
    buildToolsVersion "26.0.1"
    lintOptions {
        abortOnError false
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
    }
}

